name: Deploy GitHub Pages

# Frontend / manual deploys. Rolling batches deploy themselves in benchmark.yml
# (GITHUB_TOKEN commits do not re-trigger this workflow).
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "top/**"
      - "favicon.svg"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site (no build)
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html favicon.svg _site/
          [ -f history.db ] && cp history.db _site/
          cp -r css js _site/
          if [ -d top ]; then cp -r top _site/; fi
          if [ -f scripts/fleet_snapshot.json ]; then
            mkdir -p _site/scripts
            cp scripts/fleet_snapshot.json _site/scripts/
          fi
          for f in google*.html robots.txt; do
            [ -f "$f" ] && cp "$f" _site/ || true
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
