name: Deploy GitHub Pages

on:
  # Backup path: when rolling finishes (covers cases where push-triggered deploy is skipped)
  workflow_run:
    workflows: ["Rolling NIM Benchmark"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "top/**"
      - "history.db"
      - "favicon.svg"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Skip failed rolling runs when triggered via workflow_run
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For workflow_run, checkout the commit that finished (may be newer main)
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site (no build)
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html favicon.svg _site/
          [ -f history.db ] && cp history.db _site/
          cp -r css js _site/
          if [ -d top ]; then cp -r top _site/; fi
          if [ -f scripts/fleet_snapshot.json ]; then
            mkdir -p _site/scripts
            cp scripts/fleet_snapshot.json _site/scripts/
          fi
          for f in google*.html robots.txt; do
            [ -f "$f" ] && cp "$f" _site/ || true
          done
          echo "Site contents:"
          find _site -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
