name: Deploy GitHub Pages

# Benchmark dispatches this workflow after publishing data. The benchmark loop
# runs independently so GitHub Pages runner queues cannot delay the next test.
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "top/**"
      - "history.db"
      - "scripts/fleet_snapshot.json"
      - "scripts/build_pages.py"
      - "favicon.svg"
      - "_headers"
      - "_redirects"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build and validate static artifact
        run: python3 scripts/build_pages.py --output _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
