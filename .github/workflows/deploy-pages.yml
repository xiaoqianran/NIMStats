name: Deploy GitHub Pages

# One deploy per successful Rolling NIM Benchmark (workflow_run), plus manual
# dispatch and push of static assets. No tight loop with the benchmark job.
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "top/**"
      - "history.db"
      - "scripts/fleet_snapshot.json"
      - "scripts/build_pages.py"
      - "favicon.svg"
      - "_headers"
      - "_redirects"
  workflow_dispatch:
  workflow_run:
    workflows: ["Rolling NIM Benchmark"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    # Skip failed / cancelled benchmark runs when triggered via workflow_run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # For workflow_run, pin to the completed benchmark head so we ship
          # the data that run just pushed (not a later unrelated tip).
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build and validate static artifact
        run: python3 scripts/build_pages.py --output _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
