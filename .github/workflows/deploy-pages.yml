name: Deploy GitHub Pages

# Primary path: benchmark.yml dispatches this after publishing data so the
# benchmark loop never waits on Pages runners.
# Backup path: workflow_run catches successful Rolling NIM Benchmark completions
# even when the explicit dispatch returns a transient API error (HTTP 5xx).
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "top/**"
      - "history.db"
      - "scripts/fleet_snapshot.json"
      - "scripts/build_pages.py"
      - "favicon.svg"
      - "_headers"
      - "_redirects"
  workflow_dispatch:
  workflow_run:
    workflows: ["Rolling NIM Benchmark"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    # Skip failed / cancelled benchmark runs when triggered via workflow_run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # workflow_run checkouts default to the workflow file's branch tip;
          # for push/dispatch use the triggering SHA. For workflow_run, pin to
          # the completed benchmark's head SHA so we deploy the data it just pushed.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build and validate static artifact
        run: python3 scripts/build_pages.py --output _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
