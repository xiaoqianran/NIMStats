name: Deploy GitHub Pages

# Pages 源选 "GitHub Actions" 后，由此 workflow 发布静态看板
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "top/**"
      - "history.db"
      - "scripts/fleet_snapshot.json"
      - "favicon.svg"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
  # 方便 benchmark 更新 history.db 后手动/链式触发；
  # benchmark job 推 main 时若改了 history.db 也会走上面的 push paths

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site (no build)
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          # dashboard surface only — do not ship scripts/, .env, keys
          cp index.html favicon.svg _site/
          [ -f history.db ] && cp history.db _site/
          cp -r css js _site/
          if [ -d top ]; then cp -r top _site/; fi
          if [ -f scripts/fleet_snapshot.json ]; then mkdir -p _site/scripts && cp scripts/fleet_snapshot.json _site/scripts/; fi
          # optional SEO / verification files at root
          for f in google*.html robots.txt; do
            [ -f "$f" ] && cp "$f" _site/ || true
          done
          echo "Site contents:"
          find _site -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
