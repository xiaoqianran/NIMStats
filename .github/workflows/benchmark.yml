name: Rolling NIM Benchmark

# Full-fleet monitor. 100 models × 4 round-robin calls uses the 10-key 400 RPM pool.
on:
  workflow_dispatch:
  # Dead-man switch: if the self-chain dies (e.g. transient GitHub API 500 on
  # workflow_dispatch), hourly schedule restarts monitoring without a human.
  # concurrency group below serializes this with any in-flight chained run.
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: rolling-nim-benchmark
  cancel-in-progress: false

jobs:
  rolling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Full-fleet catalog + four-call benchmark suite
        env:
          NIM_API_KEYS: ${{ secrets.NIM_API_KEYS }}
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          BATCH_SIZE: "0"
          NIM_MAX_REQUESTS_PER_MINUTE: "40"
          NIM_MAX_IN_FLIGHT: "400"
          INCLUDE_ALL_CATALOG_MODELS: "1"
          REQUEST_TIMEOUT_SECONDS: "90"
          STALE_AFTER_MINUTES: "180"
          HEALTH_MAX_TOKENS: "24"
          THROUGHPUT_MAX_TOKENS: "128"
          LONG_TASK_MAX_TOKENS: "3072"
          LONG_TASK_TIMEOUT_SECONDS: "300"
        run: python3 -u scripts/rolling_bench.py

      - name: Update Artificial Analysis intelligence scores
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
        run: python3 scripts/update_intelligence.py
        continue-on-error: true

      - name: Generate top model endpoints
        run: python3 scripts/generate_best.py

      - name: Commit history + top
        id: publish-data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.db top/ scripts/models_cache.json scripts/fleet_snapshot.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: rolling batch update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # Chain the next benchmark FIRST so a Pages dispatch outage can never
      # stop the monitoring loop (this is what killed the chain on 2026-08-10:
      # HTTP 500 from gh workflow run deploy-pages.yml aborted the job before
      # "Start next benchmark" ran).
      - name: Start next benchmark immediately
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh workflow run benchmark.yml --ref main; then
              echo "Queued next benchmark run"
              exit 0
            fi
            echo "::warning::Benchmark dispatch attempt ${attempt} failed; retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "::error::Unable to dispatch next benchmark after retries"
          exit 1

      # Bot pushes intentionally do not trigger push workflows. workflow_dispatch
      # starts deploy-pages.yml at the newly pushed main SHA. Failures here must
      # not fail the job (continue-on-error) — monitoring continuity > one deploy.
      - name: Dispatch exact-commit Pages deploy
        if: success() || failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          for attempt in 1 2 3 4 5; do
            if gh workflow run deploy-pages.yml --ref main; then
              echo "Queued Pages deploy"
              exit 0
            fi
            echo "::warning::Deploy dispatch attempt ${attempt} failed; retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "::warning::Unable to dispatch deploy-pages.yml after retries; Pages may be stale until next successful dispatch"
          exit 1
