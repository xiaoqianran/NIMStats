name: Rolling NIM Benchmark

# Full-fleet monitor. ~100 models × (1 health + 4 throughput + 1 long) per suite
# round, across a 10-key pool at 30 RPM/key (300 req/min total).
#
# One scheduled Actions run per hour (no self-chaining). Inside that run we
# repeat equal-coverage suite rounds until RUN_BUDGET_SECONDS is nearly spent,
# so every model is retested the same number of times within the hour.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: rolling-nim-benchmark
  cancel-in-progress: true

jobs:
  rolling:
    runs-on: ubuntu-latest
    # Whole hour minus a little buffer for commit + Pages workflow_run.
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Full-fleet multi-round benchmark suite
        env:
          NIM_API_KEYS: ${{ secrets.NIM_API_KEYS }}
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          BATCH_SIZE: "0"
          # Per-key ceiling. 10 keys × 30 RPM = 300 requests/minute total.
          NIM_MAX_REQUESTS_PER_MINUTE: "30"
          NIM_MAX_IN_FLIGHT: "600"
          INCLUDE_ALL_CATALOG_MODELS: "1"
          REQUEST_TIMEOUT_SECONDS: "90"
          STALE_AFTER_MINUTES: "180"
          HEALTH_MAX_TOKENS: "24"
          THROUGHPUT_MAX_TOKENS: "128"
          # 4 throughput samples/model/round → better median + CV within each pass.
          THROUGHPUT_SAMPLE_COUNT: "4"
          # 0 = auto: keep launching equal suite rounds until budget is spent.
          SUITE_ROUNDS: "0"
          # ~50 minutes of probing inside the hourly job.
          RUN_BUDGET_SECONDS: "3000"
          LONG_TASK_MAX_TOKENS: "3072"
          LONG_TASK_TIMEOUT_SECONDS: "300"
        run: python3 -u scripts/rolling_bench.py

      - name: Update Artificial Analysis intelligence scores
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
        run: python3 scripts/update_intelligence.py
        continue-on-error: true

      - name: Generate top model endpoints
        run: python3 scripts/generate_best.py

      - name: Commit history + top
        id: publish-data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.db top/ scripts/models_cache.json scripts/fleet_snapshot.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: rolling batch update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # Pages deploy is triggered by deploy-pages.yml workflow_run on success.
      # Do NOT self-dispatch another benchmark here.
