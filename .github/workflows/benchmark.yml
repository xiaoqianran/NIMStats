name: Rolling NIM Benchmark

# Full-fleet monitor. A key pool makes one deterministic request per model.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: rolling-nim-benchmark
  cancel-in-progress: false

jobs:
  rolling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Full-fleet catalog + unified streaming benchmark
        env:
          NIM_API_KEYS: ${{ secrets.NIM_API_KEYS }}
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          BATCH_SIZE: "0"
          NIM_MAX_REQUESTS_PER_MINUTE: "40"
          NIM_MAX_IN_FLIGHT: "40"
          INCLUDE_ALL_CATALOG_MODELS: "1"
          REQUEST_TIMEOUT_SECONDS: "90"
          STALE_AFTER_MINUTES: "180"
          BENCHMARK_MAX_TOKENS: "192"
        run: python3 -u scripts/rolling_bench.py

      - name: Update Artificial Analysis intelligence scores
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
        run: python3 scripts/update_intelligence.py
        continue-on-error: true

      - name: Generate top model endpoints
        run: python3 scripts/generate_best.py

      - name: Commit history + top
        id: publish-data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.db top/ scripts/models_cache.json scripts/fleet_snapshot.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: rolling batch update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # Bot pushes intentionally do not trigger push workflows. workflow_dispatch
      # does, and starts deploy-pages.yml at the newly pushed main SHA.
      - name: Dispatch exact-commit Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
