name: Rolling NIM Benchmark

# Continuous rolling monitor: every 10 minutes, test next 8–10 models only.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling-nim-benchmark
  cancel-in-progress: false

jobs:
  rolling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rolling batch (catalog → batch → health+throughput)
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          BATCH_SIZE: "9"
          NIM_MAX_REQUESTS_PER_MINUTE: "40"
          REQUEST_TIMEOUT_SECONDS: "90"
          STALE_AFTER_MINUTES: "180"
          HEALTH_MAX_TOKENS: "8"
          THROUGHPUT_MAX_TOKENS: "120"
        run: python3 -u scripts/rolling_bench.py

      - name: Update Artificial Analysis intelligence scores
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
        run: python3 scripts/update_intelligence.py
        continue-on-error: true

      - name: Generate top model endpoints
        run: python3 scripts/generate_best.py

      - name: Commit history + top (Pages deploys via deploy-pages.yml)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.db top/ scripts/models_cache.json scripts/fleet_snapshot.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: rolling batch update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
