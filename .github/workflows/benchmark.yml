name: Benchmark NVIDIA NIM Models

on:
  workflow_dispatch:
  # Optional: enable when you want automatic runs
  # schedule:
  #   - cron: '0 * * * *'

jobs:
  test_group1:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test model group 1 (catalog + probe + bench available)
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          MODEL_GROUP: group1
          BENCH_ONLY_AVAILABLE: "1"
          PROBE_TIMEOUT_SECONDS: "25"
          REQUEST_TIMEOUT_SECONDS: "180"
        run: python3 -u scripts/test_models.py

      - name: Upload group1 results
        uses: actions/upload-artifact@v7
        with:
          name: results-group1
          path: |
            scripts/results.json
            scripts/models_cache.json
            scripts/availability_cache.json
          retention-days: 1
          if-no-files-found: warn

  test_group2:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test model group 2 (catalog + probe + bench available)
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          MODEL_GROUP: group2
          BENCH_ONLY_AVAILABLE: "1"
          PROBE_TIMEOUT_SECONDS: "25"
          REQUEST_TIMEOUT_SECONDS: "180"
        run: python3 -u scripts/test_models.py

      - name: Upload group2 results
        uses: actions/upload-artifact@v7
        with:
          name: results-group2
          path: |
            scripts/results.json
            scripts/models_cache.json
            scripts/availability_cache.json
          retention-days: 1
          if-no-files-found: warn

  merge_and_update:
    needs: [test_group1, test_group2]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all results
        uses: actions/download-artifact@v8
        with:
          path: scripts/

      - name: Merge results and update history
        run: |
          mv scripts/results-group1/results.json scripts/results-group1.json || true
          mv scripts/results-group2/results.json scripts/results-group2.json || true
          # Prefer freshest catalog cache from either group
          if [ -f scripts/results-group1/models_cache.json ]; then
            cp scripts/results-group1/models_cache.json scripts/models_cache.json
          elif [ -f scripts/results-group2/models_cache.json ]; then
            cp scripts/results-group2/models_cache.json scripts/models_cache.json
          fi
          python3 scripts/merge_results.py

      - name: Fetch and update Artificial Analysis intelligence scores
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
        run: python3 scripts/update_intelligence.py
        continue-on-error: true

      - name: Generate top model endpoint
        run: python3 scripts/generate_best.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.db top/ scripts/models_cache.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Update benchmark results (dynamic catalog + live probe)"
            git push
          else
            echo "No history updates to commit"
          fi
