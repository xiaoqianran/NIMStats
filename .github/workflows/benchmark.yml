name: Rolling NIM Benchmark

# Continuous rolling monitor: each run tests the next batch of chat models.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rolling-nim-benchmark
  cancel-in-progress: false

jobs:
  rolling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rolling batch (catalog → batch → health+throughput)
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          BATCH_SIZE: "9"
          NIM_MAX_REQUESTS_PER_MINUTE: "40"
          REQUEST_TIMEOUT_SECONDS: "90"
          STALE_AFTER_MINUTES: "180"
          HEALTH_MAX_TOKENS: "8"
          THROUGHPUT_MAX_TOKENS: "120"
        run: python3 -u scripts/rolling_bench.py

      - name: Update Artificial Analysis intelligence scores
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
        run: python3 scripts/update_intelligence.py
        continue-on-error: true

      - name: Generate top model endpoints
        run: python3 scripts/generate_best.py

      - name: Commit history + top
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.db top/ scripts/models_cache.json scripts/fleet_snapshot.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: rolling batch update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      # IMPORTANT: pushes made with GITHUB_TOKEN do NOT trigger other workflows.
      # Deploy Pages here so the site always matches the latest history.db.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html favicon.svg _site/
          [ -f history.db ] && cp history.db _site/
          cp -r css js _site/
          if [ -d top ]; then cp -r top _site/; fi
          if [ -f scripts/fleet_snapshot.json ]; then
            mkdir -p _site/scripts
            cp scripts/fleet_snapshot.json _site/scripts/
          fi
          for f in google*.html robots.txt; do
            [ -f "$f" ] && cp "$f" _site/ || true
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
